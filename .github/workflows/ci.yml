name: AI-Driven QA Automation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke suite
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run smoke tests in headless Chrome
        run: mvn -B -Dheadless=true -Dgroups=smoke test

      - name: Run Postman collection
        if: always()
        run: npx --yes newman@6.2.3 run postman/collections/ecommerce-api.postman_collection.json --reporters cli,json --reporter-json-export target/newman-report.json

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-smoke
          path: |
            target/allure-results/
            target/site/allure-maven-plugin/
            target/bug-reports/
            target/newman-report.json
          if-no-files-found: warn

  regression:
    name: Full regression suite
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run regression tests in headless Chrome
        run: mvn -B -Dheadless=true -Dgroups=regression test

      - name: Run Postman collection
        if: always()
        run: npx --yes newman@6.2.3 run postman/collections/ecommerce-api.postman_collection.json --reporters cli,json --reporter-json-export target/newman-report.json

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-regression
          path: |
            target/allure-results/
            target/site/allure-maven-plugin/
            target/bug-reports/
            target/newman-report.json
          if-no-files-found: warn
